<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="#0B0F17"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Clinical Stethoscope & Surgical Scalpel Crest -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Medical Cross Core -->
    <path d="M256 140 v232 M140 256 h232" stroke-width="32" stroke="#FFFFFF" />
    <!-- Pulse Line overlay -->
    <path d="M110 256 h50 l26 -50 l44 100 l36 -70 l24 40 h112" stroke-width="18" stroke="#F8FAFC" opacity="0.95"/>
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="420" text-anchor="middle" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="4">SURGHISTORY</text>
</svg>
